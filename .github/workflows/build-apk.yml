name: Inspect Aviator v0.2

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q Aviator_Screen_Monitor_P703_v0.2.zip -d extracted
          find extracted -type f | sort > file-list.txt

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: aviator-v02-file-list
          path: file-list.txt
